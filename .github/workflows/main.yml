name: Build Windows Phone 8 App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and extract WP8 SDK
      env:
        GH_TOKEN: ${{ secrets.SDK_TOKEN }}
      run: |
        gh release download v1.0-sdk -R sou-sand/wp8sdk -p "wp8_sdk.zip" -D $env:TEMP
        Expand-Archive -Path "$env:TEMP\wp8_sdk.zip" -DestinationPath "$env:TEMP\WP8_SDK" -Force

    - name: Install WP8 SDK files and registry
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\WindowsPhone"
        New-Item -ItemType Directory -Force -Path "C:\Program Files (x86)\MSBuild\Microsoft\WindowsPhone"
        New-Item -ItemType Directory -Force -Path "C:\Program Files (x86)\Microsoft SDKs\Windows Phone\v8.0"

        Copy-Item -Path "$env:TEMP\WP8_SDK\reference_assemblies\*" -Destination "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\WindowsPhone" -Recurse -Force
        Copy-Item -Path "$env:TEMP\WP8_SDK\msbuild_targets\*" -Destination "C:\Program Files (x86)\MSBuild\Microsoft\WindowsPhone" -Recurse -Force
        Copy-Item -Path "$env:TEMP\WP8_SDK\silverlight_xna\*" -Destination "C:\Program Files (x86)\Microsoft SDKs\Windows Phone\v8.0" -Recurse -Force

        reg import "$env:TEMP\WP8_SDK\wp8_sdk.reg"

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore packages
      run: nuget restore Wplatoon.sln

    - name: Build Windows Phone app
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        & $msbuild Wplatoon.sln /p:Configuration=Release /p:Platform=ARM /p:XapOutputs=false

        Write-Host "Files in Bin\ARM\Release:"
        Get-ChildItem -Path "Wplatoon\Bin\ARM\Release" -Recurse | Select-Object FullName

    - name: Upload XAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsPhoneApp-ARM
        path: Wplatoon/Bin/ARM/Release/
